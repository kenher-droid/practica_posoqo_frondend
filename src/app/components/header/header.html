<header class="bg-[#E1BE21] text-[#0B0B0C] shadow-md rounded-b-[25px]">
  <div class=" mx-auto px-6 py-6 flex justify-between items-center">

    <!-- Logo -->
    <div class="text-2xl font-bold text-[#0B0B0C] w-30">
      <img src="assets/Logo.png" alt="logo">
    </div>

    <!-- Menú -->
    <nav>
      <ul class="flex space-x-6">
        @for (item of menu; track item.nombre) {
          <li>
            <a 
              [routerLink]="item.ruta"
              class="px-4 py-2 rounded-lg transition-all duration-300 font-medium text-[#0B0B0C] hover:bg-black/10 hover:text-black"
            >
              {{ item.nombre }}
            </a>
          </li>
        }
      </ul>
    </nav>

  </div>
</header>
