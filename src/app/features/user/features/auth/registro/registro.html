<div class="register-container">
  <div class="logo">
    POSOQO
  </div>

  <div class="card-register">
    <h2>Regístrate</h2>

    <form (ngSubmit)="crearCuenta()">

      <!-- NOMBRE -->
      <div class="input-group">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="usuario.nombre"
          name="nombre"
          placeholder="nombre "
          required
        />
      </div>

      <!-- FECHA -->
      <div class="input-group">
        <label for="fecha">Fecha de Nacimiento</label>
        <input
          id="fecha"
          type="text"
          [(ngModel)]="usuario.fecha"
          name="fecha"
          placeholder="__/__/___"
          maxlength="10"
          inputmode="numeric"
          (input)="formatearFecha($event)"
          (keypress)="soloNumeros($event)"
          required
        />
      </div>

      <!-- TELÉFONO O CORREO -->
      <div class="input-group">
        <label for="telefono">Teléfono o Correo electrónico</label>
        <input
          id="telefono"
          type="text"
          [(ngModel)]="usuario.telefono"
          name="telefono"
          placeholder="gmail/numero"
          required
        />
      </div>

      <!-- PASSWORD -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="password-box">
          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="usuario.password"
            name="password"
            placeholder="********"
            required
          />
          <span class="toggle-password" (click)="togglePassword()" role="button" aria-label="Mostrar u ocultar contraseña">
            {{ mostrarPassword ? '🔓' : '🔒' }}
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        CREAR CUENTA
      </button>

    </form>
  </div>
</div>
