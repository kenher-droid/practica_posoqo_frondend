<header class="bg-[#E1BE21] text-[#051923] shadow-md sticky top-0 z-50 w-full px-6 py-4">
  <div class="w-full flex items-center">

    <div class="flex items-center w-[120px] min-w-[100px] flex-shrink-0">
      <a routerLink="/" class="block border-t-2 border-b-2 border-[#051923] py-1 px-2 transition-transform hover:scale-105 w-full">
        <img 
          src="/assets/Logo.webp" 
          alt="Logo POSOQO" 
          loading="lazy" 
          class="w-full h-auto block object-contain"
        >
      </a>
    </div>

    <nav role="navigation" aria-label="Menú principal" class="hidden md:flex items-center ml-auto mr-12">
      <ul class="flex space-x-12 text-xl font-semibold lowercase tracking-wide">
        <li>
          <a routerLink="/carta" [class.active-nav]="isActive('carta')" class="px-4 py-2 rounded transition-all duration-200 text-[#051923] hover:opacity-60 hover:bg-[rgba(5,25,35,0.1)] nav-link">
            carta
          </a>
        </li>
        <li>
          <a routerLink="/eventos" [class.active-nav]="isActive('eventos')" class="px-4 py-2 rounded transition-all duration-200 text-[#051923] hover:opacity-60 hover:bg-[rgba(5,25,35,0.1)] nav-link">
            eventos
          </a>
        </li>
        <li>
          <a routerLink="/nosotros" [class.active-nav]="isActive('nosotros')" class="px-4 py-2 rounded transition-all duration-200 text-[#051923] hover:opacity-60 hover:bg-[rgba(5,25,35,0.1)] nav-link">
            nosotros
          </a>
        </li>
      </ul>
    </nav>

    <div class="flex items-center flex-shrink-0">
      <a
        routerLink="/auth/login"
        class="text-xl font-semibold lowercase tracking-wide transition-all duration-200 text-[#051923] hover:opacity-80 whitespace-nowrap"
      >
        iniciar sesion
      </a>
    </div>

  </div>
</header>
