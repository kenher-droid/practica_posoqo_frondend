<div class="fidelidad-section">
  <h2 class="titulo-principal">
    Tu fidelidad se premia con cerveza <br>
    <span class="texto-amarillo">y comida gratis</span>
  </h2>

  <div class="tarjeta-blanca-contenedor">
    
    <div class="bloque-izquierdo">
      <h3 class="subtitulo-amarillo">{{ subtituloActivo() }}</h3>
      <div class="contenedor-imagen-dinamica">
        <img [src]="imagenActiva()" alt="Premio por fidelidad" class="imagen-fidelidad">
      </div>
    </div>

    <div class="bloque-derecho">
      
      <button 
        (click)="cambiarPaso(0)" 
        [class.paso-activo]="pasoActual() === 0" 
        class="boton-paso">
        <p>Regístrate y convierte tus cervezas artesanales y hamburguesas en puntos.</p>
      </button>

      <button 
        (click)="cambiarPaso(1)" 
        [class.paso-activo]="pasoActual() === 1" 
        class="boton-paso">
        <p>Acumula con cada compra para usarlo en local o para llevar a casa.</p>
      </button>

      <button 
        (click)="cambiarPaso(2)" 
        [class.paso-activo]="pasoActual() === 2" 
        class="boton-paso">
        <p>Junta suficientes puntos, elije tu plato favorito del menú y disfrútalo sin pagar un sol.</p>
      </button>

    </div>

  </div>
</div>
