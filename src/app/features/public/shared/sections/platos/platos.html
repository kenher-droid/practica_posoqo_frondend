<div class="menu-section">
  <h2 class="titulo-menu">
    Disfruta de su <span class="texto-amarillo">variedad de platos</span> <br>
    y combos pensados para tu paladar
  </h2>

  <div class="grid-platos">
    @for (plato of listaPlatos; track plato.id) {
      <div class="tarjeta-plato">
        <div class="contenedor-imagen">
          <img [src]="plato.imagen" [alt]="plato.nombre" class="imagen-menu">
        </div>
        <h3 class="nombre-plato">{{ plato.nombre }}</h3>
      </div>
    }
  </div>

  <div class="promocion-delivery">
    <div class="contenido-delivery">
      <h3 class="titulo-delivery">¿Prefieres disfrutarlo en casa?</h3>
      <p class="texto-delivery">Haz tu pedido por <strong>WhatsApp</strong> y te lo llevamos volando. ¡Delivery rápido y seguro!</p>
      <a href="https://wa.me/TU_NUMERO_AQUI" target="_blank" class="boton-whatsapp">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" class="icono-wsp">
