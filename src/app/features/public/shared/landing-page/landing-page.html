<!-- Modal verificación de edad -->
@if (mostrarModal()) {
  <div class="edad-overlay">
    <div class="edad-modal">
      <div class="edad-logo">POSOQO</div>
      <div class="edad-icono">🍺</div>
      <h2 class="edad-titulo">Verificación de edad</h2>
      <p class="edad-texto">Este sitio contiene contenido relacionado con bebidas alcohólicas. ¿Eres mayor de 18 años?</p>
      <div class="edad-acciones">
        <button class="edad-btn edad-btn--si" (click)="confirmarEdad()">Sí, soy mayor de 18</button>
        <button class="edad-btn edad-btn--no" (click)="rechazarEdad()">No, soy menor</button>
      </div>
      <p class="edad-aviso">Al ingresar confirmas que tienes 18 años o más.</p>
    </div>
  </div>
}

<section class="hero">
    <app-bienvenida></app-bienvenida>
</section>
<section class="especialidades-section">
    <app-nosotros></app-nosotros> 
</section>
<section class="hero_2">
    <app-especialidades></app-especialidades>
</section>
<section class="platos">
    <app-platos></app-platos>
</section>
<section class="hero_color_2">
    <app-visitanos></app-visitanos>
</section>
