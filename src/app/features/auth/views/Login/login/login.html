<section class="auth-card">
  <div class="auth-card__label">Iniciar sesión</div>
  <h1>Iniciar sesión</h1>
  <p class="auth-card__subtitle">Accede a tu cuenta para revisar tus pedidos y puntos.</p>

  <form class="auth-form" autocomplete="off" (ngSubmit)="submit()">
    <label>
      <span>Telefono</span>
      <input type="tel" placeholder="987654321" [(ngModel)]="telefono" name="telefono" required />
    </label>
    <label>
      <span>Contraseña</span>
      <input type="password" placeholder="••••••••" [(ngModel)]="password" name="password" required />
    </label>

    @if (error) {
      <p class="auth-error">{{ error }}</p>
    }

    <button type="submit" class="auth-submit" [disabled]="loading">
      {{ loading ? 'INGRESANDO...' : 'INICIAR SESION' }}
    </button>
  </form>

  <div class="auth-divider">O</div>

  <div class="auth-card__footer auth-footer-register">
    <p class="auth-footer-text">¿No tienes cuenta?</p>
    <a routerLink="/auth/register" class="auth-secondary-btn">Crear nueva cuenta</a>
  </div>
</section>
