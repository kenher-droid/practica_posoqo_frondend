<section class="auth-card">
  <div class="auth-card__label">Iniciar sesión</div>
  <h1>Iniciar sesión</h1>
  <p class="auth-card__subtitle">Accede a tu cuenta para revisar tus pedidos y puntos.</p>

  <form class="auth-form" autocomplete="off">
    <label>
      <span>Numero o correo</span>
      <input type="text" placeholder="tunombre@correo.com" />
    </label>
    <label>
      <span>Contraseña</span>
      <input type="password" placeholder="••••••••" />
    </label>

    <a href="#" class="auth-forgot">¿olvidaste tu contraseña?</a>

    <button type="submit" class="auth-submit">INICIAR SECCION</button>
  </form>

  <div class="auth-card__footer auth-card__footer--centered">
    <span>¿No tienes cuenta?</span>
    <a routerLink="/auth/register">Registrate</a>
  </div>
</section>
