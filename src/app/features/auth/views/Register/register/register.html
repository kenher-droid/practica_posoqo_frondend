<section class="auth-card">
  <div class="auth-card__label">Crea tu cuenta</div>
  <h1>Registro</h1>
  <p class="auth-card__subtitle">Regístrate para comenzar a acumular puntos y ordenar con POSOQO.</p>

  <form class="auth-form" autocomplete="off">
    <label>
      <span>Nombre completo</span>
      <input type="text" placeholder="Tu nombre completo" />
    </label>
    <label>
      <span>Correo electrónico</span>
      <input type="email" placeholder="tunombre@correo.com" />
    </label>
    <label>
      <span>Contraseña</span>
      <input type="password" placeholder="••••••••" />
    </label>
    <button type="submit" class="auth-submit">Crear cuenta</button>
  </form>

  <div class="auth-card__footer">
    <span>¿Ya tienes cuenta?</span>
    <a routerLink="/auth/login">Inicia sesión</a>
  </div>
</section>
